<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Nuestro Portal Secreto</title>
  
  <!-- Tipografías elegantes de Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:ital,wght@0,200;0,300;0,400;0,500;1,200;1,300&display=swap" rel="stylesheet" />

  <!-- Three.js vía CDN confiable -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    /* ==========================================================================
       1. VARIABLES GLOBALES Y RESET
       ========================================================================== */
    :root {
      --bg-dark: #02040a;
      --bg-portal: #030713;
      --gold-primary: #e6c670;
      --gold-bright: #ffd978;
      --gold-soft: rgba(230, 198, 112, 0.4);
      --gold-glow: rgba(255, 217, 120, 0.65);
      --text-white: #f5f6fa;
      --text-muted: rgba(245, 246, 250, 0.65);
      --font-serif: 'Cinzel', serif;
      --font-sans: 'Montserrat', sans-serif;
      --glass-bg: rgba(7, 14, 30, 0.6);
      --glass-border: rgba(230, 198, 112, 0.28);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      font-family: var(--font-sans);
      color: var(--text-white);
    }

    /* ==========================================================================
       2. ETAPA 1 — PORTAL DE ACCESO (CSS)
       ========================================================================== */
    #portal-stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      transition: opacity 2s cubic-bezier(0.4, 0, 0.2, 1), transform 2.5s cubic-bezier(0.4, 0, 0.2, 1);
      background: radial-gradient(circle at 50% 50%, #081126 0%, #040917 50%, #010307 100%);
    }

    #portal-stage.portal-vanish {
      opacity: 0;
      transform: scale(1.4);
      pointer-events: none;
    }

    #portal-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .portal-container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 2.5rem 2rem;
      max-width: 520px;
      width: 90%;
      background: rgba(3, 7, 20, 0.45);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(230, 198, 112, 0.08);
      transition: border-color 0.6s ease, box-shadow 0.6s ease;
    }

    .portal-symbol {
      font-size: 1.4rem;
      color: var(--gold-bright);
      margin-bottom: 1.2rem;
      filter: drop-shadow(0 0 8px var(--gold-glow));
      animation: pulseSymbol 4s ease-in-out infinite;
    }

    @keyframes pulseSymbol {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.15); filter: drop-shadow(0 0 14px var(--gold-bright)); }
    }

    .portal-title {
      font-family: var(--font-serif);
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: 2px;
      color: #fff;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 30%, var(--gold-bright) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 25px rgba(255, 217, 120, 0.25);
      margin-bottom: 0.6rem;
    }

    .portal-subtitle {
      font-size: 0.95rem;
      font-weight: 300;
      font-style: italic;
      color: var(--text-muted);
      letter-spacing: 1px;
      margin-bottom: 2.4rem;
      line-height: 1.5;
    }

    /* Casillas de Contraseña */
    .pin-container {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-bottom: 1rem;
    }

    .pin-input {
      width: 58px;
      height: 68px;
      font-family: var(--font-serif);
      font-size: 2rem;
      text-align: center;
      color: var(--gold-bright);
      background: rgba(8, 16, 38, 0.5);
      border: 1px solid var(--gold-soft);
      border-radius: 12px;
      outline: none;
      transition: all 0.25s ease;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.6);
      caret-color: transparent;
    }

    .pin-input:focus {
      border-color: var(--gold-bright);
      box-shadow: 0 0 18px var(--gold-glow), inset 0 2px 6px rgba(0, 0, 0, 0.4);
      background: rgba(14, 26, 60, 0.7);
      transform: translateY(-2px);
    }

    .pin-shake {
      animation: shakeInputs 0.45s ease-in-out;
    }

    @keyframes shakeInputs {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    .pin-success {
      border-color: var(--gold-bright) !important;
      box-shadow: 0 0 25px var(--gold-bright) !important;
      background: rgba(230, 198, 112, 0.18) !important;
      color: #ffffff !important;
    }

    .portal-error-msg {
      min-height: 24px;
      font-size: 0.9rem;
      font-weight: 300;
      font-style: italic;
      letter-spacing: 0.8px;
      color: var(--gold-bright);
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.3s ease, transform 0.3s ease;
      text-shadow: 0 0 10px rgba(255, 217, 120, 0.4);
    }

    .portal-error-msg.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ==========================================================================
       3. ETAPA 2 — INTERFAZ Y CANVAS 3D (CSS)
       ========================================================================== */
    #galaxy-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      opacity: 0;
      transition: opacity 3s cubic-bezier(0.25, 1, 0.5, 1);
    }

    #galaxy-container.galaxy-visible {
      opacity: 1;
    }

    .galaxy-hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 2.2rem 1.5rem 1.8rem;
      transition: opacity 0.6s ease;
    }

    .galaxy-title {
      font-family: var(--font-serif);
      font-size: 1.1rem;
      font-weight: 400;
      letter-spacing: 6px;
      color: rgba(255, 255, 255, 0.7);
      text-transform: uppercase;
      text-shadow: 0 0 15px rgba(230, 198, 112, 0.3);
      opacity: 0;
      transition: opacity 2s ease;
    }

    .galaxy-instructions {
      font-size: 0.82rem;
      font-weight: 300;
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, 0.45);
      text-align: center;
      opacity: 0;
      transition: opacity 2s ease;
    }

    .galaxy-hud.hud-active .galaxy-title,
    .galaxy-hud.hud-active .galaxy-instructions {
      opacity: 1;
    }

    .galaxy-instructions.fade-away {
      opacity: 0 !important;
      transition: opacity 2s ease;
    }

    /* ==========================================================================
       4. SISTEMA DE MINI-PÁGINAS (MUNDOS) Y OVERLAY
       ========================================================================== */
    .universe-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 50;
      background: radial-gradient(circle at 50% 50%, rgba(3, 7, 18, 0.62) 0%, rgba(2, 4, 10, 0.82) 100%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s cubic-bezier(0.2, 0.8, 0.25, 1);
    }

    .universe-overlay.world-active {
      opacity: 1;
      pointer-events: auto;
    }

    .mini-page {
      position: relative;
      width: 86vw;
      max-width: 940px;
      height: 86vh;
      background: rgba(4, 9, 24, 0.78);
      border: 1px solid rgba(230, 198, 112, 0.32);
      border-radius: 24px;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.85), 0 0 45px rgba(230, 198, 112, 0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: scale(0.94) translateY(20px);
      opacity: 0;
      transition: transform 0.8s cubic-bezier(0.18, 0.89, 0.32, 1.15), opacity 0.7s ease;
    }

    .universe-overlay.world-active .mini-page {
      transform: scale(1) translateY(0);
      opacity: 1;
    }

    /* Barra Superior Sticky para volver */
    .mini-page-header {
      position: sticky;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 10;
      background: rgba(4, 8, 20, 0.82);
      border-bottom: 1px solid rgba(230, 198, 112, 0.16);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 0.95rem 1.6rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .back-btn {
      background: transparent;
      border: 1px solid rgba(230, 198, 112, 0.35);
      color: var(--gold-bright);
      font-family: var(--font-sans);
      font-size: 0.85rem;
      font-weight: 400;
      letter-spacing: 1.5px;
      padding: 0.5rem 1.1rem;
      border-radius: 30px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.3s ease;
      text-transform: uppercase;
    }

    .back-btn:hover {
      background: rgba(230, 198, 112, 0.15);
      border-color: var(--gold-bright);
      box-shadow: 0 0 15px rgba(255, 217, 120, 0.35);
      transform: translateX(-3px);
    }

    .header-subtle-hint {
      font-size: 0.76rem;
      letter-spacing: 2px;
      color: rgba(245, 246, 250, 0.4);
      text-transform: uppercase;
      font-family: var(--font-serif);
    }

    /* Contenedor Escroleable Aislado */
    .mini-page-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 3rem 2.5rem 4rem;
      user-select: text;
      -webkit-user-select: text;
    }

    /* Scrollbar personalizada y elegante */
    .mini-page-content::-webkit-scrollbar {
      width: 6px;
    }
    .mini-page-content::-webkit-scrollbar-track {
      background: rgba(2, 5, 14, 0.5);
    }
    .mini-page-content::-webkit-scrollbar-thumb {
      background: rgba(230, 198, 112, 0.28);
      border-radius: 4px;
    }
    .mini-page-content::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 217, 120, 0.55);
    }
    .mini-page-content {
      scrollbar-width: thin;
      scrollbar-color: rgba(230, 198, 112, 0.28) rgba(2, 5, 14, 0.5);
    }

    /* Encabezado Principal del Mundo */
    .world-intro-header {
      text-align: center;
      margin-bottom: 3.2rem;
    }

    .world-intro-icon {
      font-size: 3.2rem;
      margin-bottom: 0.8rem;
      filter: drop-shadow(0 0 16px rgba(255, 217, 120, 0.45));
      display: inline-block;
      animation: floatSubtle 4s ease-in-out infinite;
    }

    @keyframes floatSubtle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .world-intro-title {
      font-family: var(--font-serif);
      font-size: 2.1rem;
      letter-spacing: 3px;
      color: #fff;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 40%, var(--gold-bright) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.9rem;
    }

    .world-intro-quote {
      font-style: italic;
      font-size: 1.05rem;
      font-weight: 300;
      color: rgba(245, 246, 250, 0.8);
      max-width: 620px;
      margin: 0 auto;
      line-height: 1.7;
      letter-spacing: 0.5px;
    }

    .world-divider {
      width: 70px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-bright), transparent);
      margin: 2.2rem auto 0;
    }

    /* Componentes visuales de mundos (Línea de tiempo, tarjetas, galerías) */
    .timeline {
      position: relative;
      max-width: 680px;
      margin: 0 auto;
      padding: 1.5rem 0;
    }
    .timeline::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 1px;
      background: linear-gradient(180deg, transparent, rgba(230, 198, 112, 0.45) 15%, rgba(230, 198, 112, 0.45) 85%, transparent);
      transform: translateX(-50%);
    }

    .timeline-node {
      position: relative;
      margin: 2.5rem 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .timeline-dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--gold-bright);
      box-shadow: 0 0 14px var(--gold-glow);
      z-index: 2;
      margin-bottom: 1rem;
    }
    .timeline-box {
      background: rgba(8, 17, 40, 0.65);
      border: 1px solid rgba(230, 198, 112, 0.22);
      border-radius: 16px;
      padding: 1.6rem 2rem;
      width: 85%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      transition: border-color 0.3s ease, transform 0.3s ease;
    }
    .timeline-box:hover {
      border-color: rgba(230, 198, 112, 0.5);
      transform: translateY(-2px);
    }
    .timeline-date {
      font-family: var(--font-serif);
      font-size: 0.85rem;
      color: var(--gold-bright);
      letter-spacing: 2px;
      margin-bottom: 0.4rem;
    }
    .timeline-title {
      font-family: var(--font-serif);
      font-size: 1.2rem;
      color: #fff;
      margin-bottom: 0.6rem;
    }
    .timeline-desc {
      font-size: 0.92rem;
      line-height: 1.6;
      color: rgba(245, 246, 250, 0.78);
      font-weight: 300;
    }

    /* Galería de Recuerdos */
    .memories-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.8rem;
      margin-top: 1rem;
    }
    .memory-card {
      background: rgba(7, 16, 38, 0.65);
      border: 1px solid rgba(230, 198, 112, 0.2);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.3s ease;
    }
    .memory-card:hover {
      transform: translateY(-5px);
      border-color: rgba(230, 198, 112, 0.55);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6), 0 0 15px rgba(230, 198, 112, 0.15);
    }
    .memory-photo-placeholder {
      width: 100%;
      height: 190px;
      background: radial-gradient(circle at 50% 50%, rgba(16, 30, 68, 0.7), rgba(4, 9, 22, 0.95));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid rgba(230, 198, 112, 0.15);
      color: rgba(230, 198, 112, 0.7);
      font-size: 0.82rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      gap: 0.6rem;
    }
    .memory-info {
      padding: 1.2rem;
      text-align: left;
    }
    .memory-date {
      font-size: 0.75rem;
      color: var(--gold-bright);
      letter-spacing: 1px;
      font-family: var(--font-serif);
      margin-bottom: 0.3rem;
    }
    .memory-name {
      font-size: 1.05rem;
      color: #fff;
      font-family: var(--font-serif);
      margin-bottom: 0.5rem;
    }
    .memory-caption {
      font-size: 0.85rem;
      color: rgba(245, 246, 250, 0.7);
      line-height: 1.5;
      font-weight: 300;
    }

    /* Cartas Estilo Biblioteca */
    .letters-list {
      display: flex;
      flex-direction: column;
      gap: 1.4rem;
      max-width: 720px;
      margin: 0 auto;
    }
    .letter-envelope {
      background: rgba(7, 16, 38, 0.65);
      border: 1px solid rgba(230, 198, 112, 0.22);
      border-radius: 16px;
      padding: 1.6rem 2rem;
      cursor: pointer;
      transition: all 0.35s ease;
      display: flex;
      flex-direction: column;
    }
    .letter-envelope:hover {
      border-color: var(--gold-bright);
      background: rgba(10, 22, 52, 0.8);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5), 0 0 18px rgba(230, 198, 112, 0.15);
    }
    .letter-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.6rem;
    }
    .letter-num {
      font-family: var(--font-serif);
      font-size: 0.8rem;
      letter-spacing: 2px;
      color: var(--gold-bright);
      text-transform: uppercase;
    }
    .letter-badge {
      font-size: 0.8rem;
      color: var(--gold-bright);
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }
    .letter-headline {
      font-family: var(--font-serif);
      font-size: 1.25rem;
      color: #fff;
      margin-bottom: 0.5rem;
    }
    .letter-preview {
      font-size: 0.92rem;
      line-height: 1.6;
      color: rgba(245, 246, 250, 0.7);
      font-weight: 300;
      font-style: italic;
    }
    .letter-expanded-content {
      margin-top: 1.2rem;
      padding-top: 1.2rem;
      border-top: 1px dashed rgba(230, 198, 112, 0.25);
      display: none;
      font-style: normal;
      color: rgba(245, 246, 250, 0.9);
      line-height: 1.8;
      font-size: 0.95rem;
    }
    .letter-envelope.open .letter-expanded-content {
      display: block;
      animation: fadeInText 0.4s ease;
    }

    @keyframes fadeInText {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ==========================================================================
       REPRODUCTOR DE MÚSICA — NUESTRA CANCIÓN
       ========================================================================== */
    .music-box {
      max-width: 580px;
      margin: 0 auto;
      background: rgba(8, 18, 44, 0.65);
      border: 1px solid rgba(230, 198, 112, 0.28);
      border-radius: 20px;
      padding: 2.4rem 2rem;
      text-align: center;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.7), 0 0 25px rgba(230, 198, 112, 0.08);
    }

    .music-cover-wrapper {
      position: relative;
      width: 220px;
      height: 220px;
      margin: 0 auto 1.8rem;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(230, 198, 112, 0.32);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.75), 0 0 20px rgba(230, 198, 112, 0.12);
      transition: box-shadow 0.6s ease, transform 0.6s ease;
      background: radial-gradient(circle at 50% 50%, rgba(20, 38, 85, 0.9), rgba(5, 10, 26, 0.95));
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Pulso sutil y elegante al reproducir */
    .music-cover-wrapper.is-playing {
      animation: coverBreathing 4s ease-in-out infinite;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.85), 0 0 30px rgba(255, 217, 120, 0.35);
      border-color: rgba(255, 217, 120, 0.6);
    }

    @keyframes coverBreathing {
      0%, 100% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.025); filter: brightness(1.08); }
    }

    .music-cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .music-cover-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      color: var(--gold-bright);
      font-size: 2.8rem;
    }

    .track-title {
      font-family: var(--font-serif);
      font-size: 1.45rem;
      letter-spacing: 1.5px;
      color: #fff;
      margin-bottom: 0.35rem;
    }

    .track-artist {
      font-size: 0.9rem;
      color: rgba(245, 246, 250, 0.65);
      font-weight: 300;
      letter-spacing: 1px;
      margin-bottom: 1.8rem;
      min-height: 1.2rem;
    }

    /* Barra de progreso interactiva */
    .player-progress-bar {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      margin-bottom: 0.7rem;
      position: relative;
      cursor: pointer;
      overflow: hidden;
      transition: height 0.2s ease;
    }

    .player-progress-bar:hover {
      height: 8px;
    }

    .player-progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--gold-primary), var(--gold-bright));
      border-radius: 6px;
      box-shadow: 0 0 10px var(--gold-glow);
      pointer-events: none;
      transition: width 0.1s linear;
    }

    .player-times {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: rgba(245, 246, 250, 0.55);
      margin-bottom: 1.4rem;
      font-variant-numeric: tabular-nums;
    }

    .player-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.5rem;
      margin-bottom: 1.4rem;
    }

    .player-btn {
      background: transparent;
      border: 1px solid rgba(230, 198, 112, 0.35);
      color: var(--gold-bright);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;

      { id: "cancion", title: "Nuestra canción", icon: "🎵", position: { x: -90, y: 25, z: -80 }, color: 0xa9c6ff, size: 2.8, isCore: false },
      { id: "futuro", title: "Nuestro futuro", icon: "🌙", position: { x: 30, y: -22, z: 120 }, color: 0xffeaa7, size: 2.8, isCore: false },
      { id: "secreto", title: "Nuestro secreto", icon: "🔐", position: { x: -120, y: -18, z: -35 }, color: 0xdfb4ff, size: 2.8, isCore: false },
      { id: "dios", title: "Dios", icon: "✝", position: { x: 0, y: 5, z: 0 }, color: 0xffffff, size: 4.8, isCore: true }
    ];

    /* ==========================================================================
       FONDO Y CORAZONES DORADOS DEL PORTAL (CANVAS 2D)
       ========================================================================== */
    const portalCanvas = document.getElementById("portal-canvas");
    const portalCtx = portalCanvas.getContext("2d");
    let portalAnimationId = null;
    let hearts = [];
    let backgroundStars = [];

    function resizePortalCanvas() {
      if (!portalCanvas) return;
      portalCanvas.width = window.innerWidth;
      portalCanvas.height = window.innerHeight;
      initBackgroundStars();
    }

    function initBackgroundStars() {
      backgroundStars = [];
      const count = Math.floor((window.innerWidth * window.innerHeight) / 4500);
      for (let i = 0; i < count; i++) {
        backgroundStars.push({
          x: Math.random() * portalCanvas.width,
          y: Math.random() * portalCanvas.height,
          radius: Math.random() * 1.3 + 0.3,
          alpha: Math.random() * 0.7 + 0.2,
          speed: Math.random() * 0.015 + 0.005,
          phase: Math.random() * Math.PI * 2
        });
      }
    }

    function createHeart() {
      return {
        x: Math.random() * portalCanvas.width,
        y: -30,
        size: Math.random() * 12 + 10,
        speedY: Math.random() * 0.9 + 0.45,
        speedX: (Math.random() - 0.5) * 0.4,
        rotation: (Math.random() - 0.5) * 0.5,
        rotationSpeed: (Math.random() - 0.5) * 0.02,
        alpha: Math.random() * 0.4 + 0.3
      };
    }

    function initHearts() {
      hearts = [];
      const initialCount = 18;
      for (let i = 0; i < initialCount; i++) {
        const h = createHeart();
        h.y = Math.random() * portalCanvas.height;
        hearts.push(h);
      }
    }

    function drawGoldenHeart(ctx, x, y, size, rotation, alpha) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotation);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = "#f5d77f";
      ctx.shadowColor = "rgba(255, 217, 120, 0.4)";
      ctx.shadowBlur = 8;
      ctx.font = `${size}px sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("♥", 0, 0);
      ctx.restore();
    }

    function animatePortal() {
      if (!portalCanvas) return;
      portalCtx.clearRect(0, 0, portalCanvas.width, portalCanvas.height);

      for (let star of backgroundStars) {
        star.phase += star.speed;
        const currentAlpha = star.alpha + Math.sin(star.phase) * 0.25;
        portalCtx.fillStyle = `rgba(255, 255, 255, ${Math.max(0.1, Math.min(1, currentAlpha))})`;
        portalCtx.beginPath();
        portalCtx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        portalCtx.fill();
      }

      if (hearts.length < 28 && Math.random() < 0.04) {
        hearts.push(createHeart());
      }

      for (let i = hearts.length - 1; i >= 0; i--) {
        const h = hearts[i];
        h.y += h.speedY;
        h.x += h.speedX;
        h.rotation += h.rotationSpeed;

        drawGoldenHeart(portalCtx, h.x, h.y, h.size, h.rotation, h.alpha);

        if (h.y > portalCanvas.height + 40) {
          hearts.splice(i, 1);
        }
      }

      portalAnimationId = requestAnimationFrame(animatePortal);
    }

    window.addEventListener("resize", resizePortalCanvas);
    resizePortalCanvas();
    initHearts();
    animatePortal();

    /* ==========================================================================
       GESTIÓN DE CONTRASEÑA Y VALIDACIÓN
       ========================================================================== */
    const pinInputs = [
      document.getElementById("pin-1"),
      document.getElementById("pin-2"),
      document.getElementById("pin-3"),
      document.getElementById("pin-4")
    ];
    const portalError = document.getElementById("portal-error");
    const portalStage = document.getElementById("portal-stage");
    let isVerifying = false;

    pinInputs.forEach((input, index) => {
      input.addEventListener("input", (e) => {
        const val = e.target.value.replace(/[^0-9]/g, "");
        e.target.value = val;

        if (val) {
          if (index < pinInputs.length - 1) {
            pinInputs[index + 1].focus();
          } else {
            checkPassword();
          }
        }
      });

      input.addEventListener("keydown", (e) => {
        if (e.key === "Backspace" && !e.target.value && index > 0) {
          pinInputs[index - 1].focus();
        }
      });

      input.addEventListener("paste", (e) => {
        e.preventDefault();
        const pastedData = (e.clipboardData || window.clipboardData).getData("text").trim();
        const digits = pastedData.replace(/[^0-9]/g, "").slice(0, 4);
        if (digits) {
          digits.split("").forEach((d, i) => {
            if (pinInputs[i]) pinInputs[i].value = d;
          });
          if (digits.length === 4) {
            checkPassword();
          } else if (pinInputs[digits.length]) {
            pinInputs[digits.length].focus();
          }
        }
      });
    });

    function checkPassword() {
      if (isVerifying) return;
      const enteredCode = pinInputs.map(input => input.value).join("");
      if (enteredCode.length < 4) return;

      isVerifying = true;

      if (enteredCode === PASSCODE) {
        handleSuccessPassword();
      } else {
        handleFailedPassword();
      }
    }

    function handleSuccessPassword() {
      portalError.classList.remove("visible");
      pinInputs.forEach(input => {
        input.classList.add("pin-success");
        input.disabled = true;
      });

      setTimeout(() => {
        startPortalTransition();
      }, 1000);
    }

    function handleFailedPassword() {
      portalError.textContent = ERROR_PHRASE;
      portalError.classList.add("visible");

      const container = document.querySelector(".pin-container");
      container.classList.add("pin-shake");

      setTimeout(() => {
        container.classList.remove("pin-shake");
        pinInputs.forEach(input => (input.value = ""));
        pinInputs[0].focus();
        isVerifying = false;
      }, 1200);
    }

    /* ==========================================================================
       TRANSICIÓN CINEMATOGRÁFICA
       ========================================================================== */
    function startPortalTransition() {
      portalStage.classList.add("portal-vanish");

      setTimeout(() => {
        if (portalAnimationId) cancelAnimationFrame(portalAnimationId);
      }, 2500);

      initGalaxyScene();
      const galaxyContainer = document.getElementById("galaxy-container");
      galaxyContainer.classList.add("galaxy-visible");

      const hud = document.getElementById("galaxy-hud");
      setTimeout(() => {
        hud.classList.add("hud-active");
      }, 2200);

      setTimeout(() => {
        const hint = document.getElementById("galaxy-hint");
        if (hint) hint.classList.add("fade-away");
      }, 9000);
    }

    /* ==========================================================================
       GALAXIA 3D THREE.JS (ESCENA, CÁMARA, RENDERER)
       ========================================================================== */
    let scene, camera, renderer;
    let galaxyPoints, coreLightMesh, specialStarMeshes = [];
    let raycaster, mouse;
    let isDragging = false;
    let previousPointerPosition = { x: 0, y: 0 };
    let sphericalCoords = { radius: 260, theta: Math.PI / 3, phi: Math.PI / 4 };
    let targetSphericalCoords = { radius: 210, theta: 0.8, phi: 0.9 };
    let activeWorld = null;

    function initGalaxyScene() {
      const container = document.getElementById("galaxy-container");

      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x02040a, 0.0016);

      camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 2000);
      updateCameraPosition();

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setClearColor(0x02040a, 1);
      container.appendChild(renderer.domElement);

      raycaster = new THREE.Raycaster();
      raycaster.params.Points = { threshold: 3 };
      mouse = new THREE.Vector2(-9999, -9999);

      buildGalaxyStructure();
      buildGalaxyCore();
      buildSpecialStars();
      setupGalaxyControls();

      sphericalCoords.radius = 420;
      targetSphericalCoords.radius = 210;

      window.addEventListener("resize", onGalaxyWindowResize);
      renderGalaxyLoop();
    }

    /* ==========================================================================
       GENERACIÓN DE BRAZOS ESPIRALES Y PARTÍCULAS
       ========================================================================== */
    function buildGalaxyStructure() {
      const particleCount = 42000;
      const arms = 5;
      const galaxyRadius = 150;
      const spin = 1.1;

      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(particleCount * 3);
      const colors = new Float32Array(particleCount * 3);

      const colorInside = new THREE.Color(0xffe6a3);
      const colorMid = new THREE.Color(0xd4af37);
      const colorOutside = new THREE.Color(0x3d5a9d);
      const colorNebula = new THREE.Color(0x6b4c82);

      for (let i = 0; i < particleCount; i++) {
        const i3 = i * 3;
        const r = Math.pow(Math.random(), 2.2) * galaxyRadius;
        const armAngle = ((i % arms) / arms) * Math.PI * 2;
        const spinAngle = r * (spin / galaxyRadius) * 4.5;

        const randomX = (Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * (galaxyRadius - r)) * 0.18;
        const randomY = (Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * (galaxyRadius - r)) * 0.12;
        const randomZ = (Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * (galaxyRadius - r)) * 0.18;

        positions[i3] = Math.cos(armAngle + spinAngle) * r + randomX;
        positions[i3 + 1] = randomY;
        positions[i3 + 2] = Math.sin(armAngle + spinAngle) * r + randomZ;

        const mixedColor = colorInside.clone();
        if (r < galaxyRadius * 0.35) {
          mixedColor.lerp(colorMid, r / (galaxyRadius * 0.35));
        } else {
          const t = (r - galaxyRadius * 0.35) / (galaxyRadius * 0.65);
          mixedColor.copy(colorMid).lerp(Math.random() > 0.3 ? colorOutside : colorNebula, t);
        }

        colors[i3] = mixedColor.r;
        colors[i3 + 1] = mixedColor.g;
        colors[i3 + 2] = mixedColor.b;
      }

      geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));

      const particleTexture = createCircularParticleTexture();

      const material = new THREE.PointsMaterial({
        size: 1.4,
        sizeAttenuation: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        vertexColors: true,
        map: particleTexture,
        transparent: true,
        opacity: 0.85
      });

      galaxyPoints = new THREE.Points(geometry, material);
      scene.add(galaxyPoints);
    }

    function createCircularParticleTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 64;
      canvas.height = 64;
      const ctx = canvas.getContext("2d");

      const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      gradient.addColorStop(0, "rgba(255, 255, 255, 1)");
      gradient.addColorStop(0.3, "rgba(255, 225, 150, 0.7)");
      gradient.addColorStop(0.7, "rgba(100, 140, 255, 0.15)");
      gradient.addColorStop(1, "rgba(0, 0, 0, 0)");

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 64, 64);

      return new THREE.CanvasTexture(canvas);
    }

    /* ==========================================================================
       NÚCLEO GALÁCTICO CENTRAL
       ========================================================================== */
    function buildGalaxyCore() {
      const coreGeo = new THREE.SphereGeometry(6.5, 32, 32);
      const coreMat = new THREE.MeshBasicMaterial({
        color: 0xfff4d1,
        transparent: true,
        opacity: 0.95
      });
      coreLightMesh = new THREE.Mesh(coreGeo, coreMat);
      scene.add(coreLightMesh);

      const haloGeo = new THREE.SphereGeometry(14, 32, 32);
      const haloMat = new THREE.MeshBasicMaterial({
        color: 0xffd369,
        transparent: true,
        opacity: 0.22,
        blending: THREE.AdditiveBlending,
        side: THREE.BackSide
      });
      const haloMesh = new THREE.Mesh(haloGeo, haloMat);
      coreLightMesh.add(haloMesh);

      const pointLight = new THREE.PointLight(0xffdf80, 2, 300);
      scene.add(pointLight);
    }

    /* ==========================================================================
       ESTRELLAS ESPECIALES INTERACTIVAS
       ========================================================================== */
    function buildSpecialStars() {
      const starTexture = createCircularParticleTexture();

      specialStarsData.forEach((data) => {
        const starGroup = new THREE.Group();
        starGroup.position.set(data.position.x, data.position.y, data.position.z);

        const starMat = new THREE.SpriteMaterial({
          map: starTexture,
          color: data.color,
          blending: THREE.AdditiveBlending,
          transparent: true,
          opacity: 0.95
        });
        const sprite = new THREE.Sprite(starMat);
        sprite.scale.set(data.size, data.size, 1);
        starGroup.add(sprite);

        const ringGeo = new THREE.RingGeometry(data.size * 0.9, data.size * 1.15, 32);
        const ringMat = new THREE.MeshBasicMaterial({
          color: data.color,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.45,
          blending: THREE.AdditiveBlending
        });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        ringMesh.rotation.x = Math.PI / 2 + (Math.random() - 0.5) * 0.5;
        starGroup.add(ringMesh);

        if (data.isCore) {
          const godRingGeo = new THREE.RingGeometry(data.size * 1.5, data.size * 1.7, 40);
          const godRingMat = new THREE.MeshBasicMaterial({
            color: 0xfff0b8,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending
          });
          const godRing = new THREE.Mesh(godRingGeo, godRingMat);
          godRing.rotation.y = Math.PI / 3;
          starGroup.add(godRing);
        }

        const hitGeo = new THREE.SphereGeometry(data.size * 2, 16, 16);
        const hitMat = new THREE.MeshBasicMaterial({ visible: false });
        const hitMesh = new THREE.Mesh(hitGeo, hitMat);
        hitMesh.userData = { starData: data, groupRef: starGroup };
        starGroup.add(hitMesh);

        scene.add(starGroup);
        specialStarMeshes.push(hitMesh);
      });
    }

    /* ==========================================================================
       CONTROLES DE MOUSE, TÁCTIL Y ZOOM
       ========================================================================== */
    let touchStartDist = 0;

    function setupGalaxyControls() {
      const dom = renderer.domElement;

      dom.addEventListener("mousedown", (e) => {
        if (activeWorld) return;
        isDragging = true;
        previousPointerPosition = { x: e.clientX, y: e.clientY };
      });

      window.addEventListener("mouseup", () => {
        isDragging = false;
      });

      dom.addEventListener("mousemove", (e) => {
        if (activeWorld) return;
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

        if (isDragging) {
          const deltaX = e.clientX - previousPointerPosition.x;
          const deltaY = e.clientY - previousPointerPosition.y;

          targetSphericalCoords.theta -= deltaX * 0.006;
          targetSphericalCoords.phi = Math.max(0.12, Math.min(Math.PI - 0.12, targetSphericalCoords.phi + deltaY * 0.006));

          previousPointerPosition = { x: e.clientX, y: e.clientY };
        }
      });

      dom.addEventListener("wheel", (e) => {
        if (activeWorld) return;
        e.preventDefault();
        targetSphericalCoords.radius = Math.max(50, Math.min(380, targetSphericalCoords.radius + e.deltaY * 0.25));
      }, { passive: false });

      dom.addEventListener("click", () => {
        if (!activeWorld) checkStarIntersection(true);
      });

      dom.addEventListener("touchstart", (e) => {
        if (activeWorld) return;
        if (e.touches.length === 1) {
          isDragging = true;
          previousPointerPosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
          mouse.x = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
          mouse.y = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
        } else if (e.touches.length === 2) {
          isDragging = false;
          touchStartDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
        }
      }, { passive: true });

      dom.addEventListener("touchmove", (e) => {
        if (activeWorld) return;
        if (e.touches.length === 1 && isDragging) {
          const deltaX = e.touches[0].clientX - previousPointerPosition.x;
          const deltaY = e.touches[0].clientY - previousPointerPosition.y;

          targetSphericalCoords.theta -= deltaX * 0.007;
          targetSphericalCoords.phi = Math.max(0.15, Math.min(Math.PI - 0.15, targetSphericalCoords.phi + deltaY * 0.007));

          previousPointerPosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        } else if (e.touches.length === 2) {
          const currentDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          const diff = touchStartDist - currentDist;
          targetSphericalCoords.radius = Math.max(50, Math.min(380, targetSphericalCoords.radius + diff * 0.45));
          touchStartDist = currentDist;
        }
      }, { passive: true });

      dom.addEventListener("touchend", (e) => {
        if (activeWorld) return;
        isDragging = false;
        if (e.changedTouches.length === 1) {
          mouse.x = (e.changedTouches[0].clientX / window.innerWidth) * 2 - 1;
          mouse.y = -(e.changedTouches[0].clientY / window.innerHeight) * 2 + 1;
          checkStarIntersection(true);
        }
      });
    }

    function updateCameraPosition() {
      camera.position.x = sphericalCoords.radius * Math.sin(sphericalCoords.phi) * Math.sin(sphericalCoords.theta);
      camera.position.y = sphericalCoords.radius * Math.cos(sphericalCoords.phi);
      camera.position.z = sphericalCoords.radius * Math.sin(sphericalCoords.phi) * Math.cos(sphericalCoords.theta);
      camera.lookAt(0, 0, 0);
    }

    function checkStarIntersection(triggerOpen = false) {
      if (!raycaster || !camera || activeWorld) return;
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(specialStarMeshes, false);

      if (intersects.length > 0) {
        document.body.style.cursor = "pointer";
        const hitObject = intersects[0].object;
        const star = hitObject.userData.starData;

        if (triggerOpen && star) {
          openWorld(star, hitObject);
        }
      } else {
        document.body.style.cursor = "default";
      }
    }

    /* ==========================================================================
       CICLO DE RENDERIZADO CONTINUO
       ========================================================================== */
    let clock = new THREE.Clock();

    function renderGalaxyLoop() {
      requestAnimationFrame(renderGalaxyLoop);

      const elapsedTime = clock.getElapsedTime();

      if (galaxyPoints) {
        galaxyPoints.rotation.y = elapsedTime * 0.035;
      }

      sphericalCoords.radius += (targetSphericalCoords.radius - sphericalCoords.radius) * 0.045;
      sphericalCoords.theta += (targetSphericalCoords.theta - sphericalCoords.theta) * 0.06;
      sphericalCoords.phi += (targetSphericalCoords.phi - sphericalCoords.phi) * 0.06;
      updateCameraPosition();

      if (coreLightMesh) {
        const pulse = 1 + Math.sin(elapsedTime * 2) * 0.06;
        coreLightMesh.scale.set(pulse, pulse, pulse);
      }

      specialStarMeshes.forEach((hitMesh) => {
        const group = hitMesh.userData.groupRef;
        if (group) {
          const starPulse = 1 + Math.sin(elapsedTime * 3 + hitMesh.id) * 0.12;
          group.children[0].scale.set(
            hitMesh.userData.starData.size * starPulse,
            hitMesh.userData.starData.size * starPulse,
            1
          );
          if (group.children[1]) {
            group.children[1].rotation.z = elapsedTime * 0.4;
          }
        }
      });

      if (!activeWorld) {
        checkStarIntersection(false);
      }

      renderer.render(scene, camera);
    }

    function onGalaxyWindowResize() {
      if (!camera || !renderer) return;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    /* ==========================================================================
       SISTEMA DE CONTROL DE MINI-PÁGINAS (MUNDOS)
       ========================================================================== */
    const universeOverlay = document.getElementById("universe-overlay");
    const miniPageScrollArea = document.getElementById("mini-page-scroll-area");
    const worldBackBtn = document.getElementById("world-back-btn");
    const headerHint = document.getElementById("header-hint");
    const globalAudio = document.getElementById("global-music-player");
    let savedCameraRadius = null;

    function normalizeStarKey(id) {
      if (id === "cancion") return "musica";
      return id;
    }

    function openWorld(starData, hitMesh) {
      const worldKey = normalizeStarKey(starData.id);
      const worldInfo = worlds[worldKey];
      if (!worldInfo) return;

      activeWorld = worldKey;
      document.body.style.cursor = "default";

      savedCameraRadius = targetSphericalCoords.radius;
      targetSphericalCoords.radius = Math.max(70, targetSphericalCoords.radius * 0.85);

      if (hitMesh && hitMesh.userData.groupRef) {
        const sprite = hitMesh.userData.groupRef.children[0];
        if (sprite) {
          sprite.scale.set(starData.size * 1.8, starData.size * 1.8, 1);
        }
      }

      headerHint.textContent = `Mundo · ${worldInfo.title}`;

      const fullHTML = `
        <div class="world-intro-header">
          <div class="world-intro-icon">${worldInfo.icon}</div>
          <h2 class="world-intro-title">${worldInfo.title}</h2>
          <p class="world-intro-quote">${worldInfo.quote}</p>
          <div class="world-divider"></div>
        </div>
        ${worldInfo.render()}
      `;

      miniPageScrollArea.innerHTML = fullHTML;
      miniPageScrollArea.scrollTop = 0;

      // Si se abre "Nuestra canción", enlazar interactividad del reproductor
      if (worldKey === "musica") {
        setupMusicPlayerInteraction();
      }

      setTimeout(() => {
        universeOverlay.classList.add("world-active");
        universeOverlay.setAttribute("aria-hidden", "false");
      }, 400);
    }

    function closeWorld() {
      if (!activeWorld) return;

      universeOverlay.classList.remove("world-active");
      universeOverlay.setAttribute("aria-hidden", "true");

      if (savedCameraRadius !== null) {
        targetSphericalCoords.radius = savedCameraRadius;
      }

      setTimeout(() => {
        activeWorld = null;
        miniPageScrollArea.innerHTML = "";
      }, 700);
    }

    worldBackBtn.addEventListener("click", closeWorld);

    universeOverlay.addEventListener("click", (e) => {
      if (e.target === universeOverlay) {
        closeWorld();
      }
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && activeWorld) {
        closeWorld();
      }
    });

    const miniPagePanel = document.getElementById("mini-page-panel");
    miniPagePanel.addEventListener("wheel", (e) => {
      e.stopPropagation();
    }, { passive: true });

    miniPagePanel.addEventListener("touchmove", (e) => {
      e.stopPropagation();
    }, { passive: true });

    /* ==========================================================================
       CONTROL DEL REPRODUCTOR DE AUDIO (PASSACAGLIA VARIATIONS)
       ========================================================================== */
    function formatTime(seconds) {
      if (isNaN(seconds) || seconds < 0) return "00:00";
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function setupMusicPlayerInteraction() {
      const coverBox = document.getElementById("music-cover-box");
      const btnTogglePlay = document.getElementById("btn-toggle-play");
      const playIconSymbol = document.getElementById("play-icon-symbol");
      const btnBackward = document.getElementById("btn-backward-10");
      const btnForward = document.getElementById("btn-forward-10");
      const progressBar = document.getElementById("music-progress-bar");
      const progressFill = document.getElementById("music-progress-fill");
      const currentTimeElem = document.getElementById("music-current-time");
      const durationTimeElem = document.getElementById("music-duration-time");
      const volumeSlider = document.getElementById("music-volume-slider");

      // Si la fuente de audio no ha sido asignada, asignarla
      if (!globalAudio.src || !globalAudio.src.includes(encodeURI(musicWorld.audio))) {
        globalAudio.src = musicWorld.audio;
      }

      // Sincronizar estado visual
      function updatePlayButtonUI() {
        if (!globalAudio.paused) {
          playIconSymbol.textContent = "⏸";
          if (coverBox) coverBox.classList.add("is-playing");
        } else {
          playIconSymbol.textContent = "▶";
          if (coverBox) coverBox.classList.remove("is-playing");
        }
      }

      updatePlayButtonUI();

      if (globalAudio.duration) {
        durationTimeElem.textContent = formatTime(globalAudio.duration);
        currentTimeElem.textContent = formatTime(globalAudio.currentTime);
        const percent = (globalAudio.currentTime / globalAudio.duration) * 100;
        progressFill.style.width = `${percent}%`;
      }

      // Evento Play / Pause
      btnTogglePlay.onclick = () => {
        if (globalAudio.paused) {
          globalAudio.play().then(() => {
            updatePlayButtonUI();
          }).catch(err => {
            console.log("Esperando archivo de audio local o interacción:", err);
          });
        } else {
          globalAudio.pause();
          updatePlayButtonUI();
        }
      };

      // Retroceder / Adelantar 10s
      btnBackward.onclick = () => {
        globalAudio.currentTime = Math.max(0, globalAudio.currentTime - 10);
      };

      btnForward.onclick = () => {
        if (globalAudio.duration) {
          globalAudio.currentTime = Math.min(globalAudio.duration, globalAudio.currentTime + 10);
        }
      };

      // Control de volumen
      volumeSlider.value = globalAudio.volume;
      volumeSlider.oninput = (e) => {
        globalAudio.volume = parseFloat(e.target.value);
      };

      // Clic en la barra de progreso para saltar en la canción
      progressBar.onclick = (e) => {
        if (!globalAudio.duration) return;
        const rect = progressBar.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const newFraction = Math.max(0, Math.min(1, clickX / rect.width));
        globalAudio.currentTime = newFraction * globalAudio.duration;
      };

      // Actualización de tiempos y barra de progreso durante la reproducción
      globalAudio.ontimeupdate = () => {
        if (!activeWorld || activeWorld !== "musica") return;
        if (globalAudio.duration) {
          const percent = (globalAudio.currentTime / globalAudio.duration) * 100;
          progressFill.style.width = `${percent}%`;
          currentTimeElem.textContent = formatTime(globalAudio.currentTime);
          durationTimeElem.textContent = formatTime(globalAudio.duration);
        } else {
          currentTimeElem.textContent = formatTime(globalAudio.currentTime);
        }
      };

      globalAudio.onloadedmetadata = () => {
        if (durationTimeElem) {
          durationTimeElem.textContent = formatTime(globalAudio.duration);
        }
      };

      globalAudio.onended = () => {
        updatePlayButtonUI();
        progressFill.style.width = "0%";
      };
    }
  </script>
</body>
</html>
